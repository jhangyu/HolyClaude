name: lint
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 shellcheck
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile check
        run: |
          python -m py_compile scripts/*.py
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node syntax check
        run: |
          if compgen -G "scripts/*.mjs" > /dev/null; then
            for f in scripts/*.mjs scripts/ci/*.mjs; do
              [ -f "$f" ] && node --check "$f"
            done
          fi
